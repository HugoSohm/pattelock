name: Bug Report
description: Report a bug to help us improve Pattelock.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Provide a step-by-step guide on how to reproduce the bug.
      placeholder: 1. Open Pattelock...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pattelock Version
      description: Check the version in the installer name or in package.json.
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (X11)
        - Linux (Wayland)
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Which mode was Pattelock in when the bug happened?
      options:
        - Protection on (selected keys blocked)
        - Paused
        - Whole keyboard locked
        - Not related to a mode
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard
      description: Keyboard layout and model, if the bug is about a key.
      placeholder: e.g. AZERTY, Apple Magic Keyboard, laptop keyboard with Fn row
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste any error logs from the terminal or attach screenshots.
