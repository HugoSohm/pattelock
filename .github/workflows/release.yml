name: "Publish Release"

on:
  push:
    branches:
      - main

jobs:
  check-version:
    name: "Check Version"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      body: ${{ steps.check.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check version and extract changelog
        id: check
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Version $VERSION already exists. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION is new. Proceeding with release."
            echo "should_release=true" >> $GITHUB_OUTPUT

            node -e "
              const fs = require('fs');
              const version = '$VERSION';
              const content = fs.readFileSync('Changelog.md', 'utf8').split('\n');
              const startIdx = content.findIndex(l => l.startsWith('## ' + version));
              if (startIdx === -1) {
                fs.writeFileSync('extracted_changelog.txt', '### Version ' + version);
                process.exit(0);
              }
              const nextIdx = content.slice(startIdx + 1).findIndex(l => l.startsWith('## '));
              const body = content.slice(startIdx + 1, nextIdx === -1 ? undefined : startIdx + 1 + nextIdx).join('\n').trim();
              fs.writeFileSync('extracted_changelog.txt', body);
            "

            DELIMITER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
            echo "body<<$DELIMITER" >> $GITHUB_OUTPUT
            cat extracted_changelog.txt >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "$DELIMITER" >> $GITHUB_OUTPUT
          fi

  build:
    name: "Build ${{ matrix.os_name }}"
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest-amd64, macos-latest-arm64, ubuntu-22.04, windows-latest, windows-latest-arm64]
        include:
          - platform: macos-latest-arm64
            real_platform: macos-latest
            arch: aarch64
            os_name: "macOS (Apple Silicon)"
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: macos-latest-amd64
            real_platform: macos-latest
            arch: x64
            os_name: "macOS (Intel)"
            args: "--target x86_64-apple-darwin --bundles app"
          - platform: ubuntu-22.04
            real_platform: ubuntu-22.04
            arch: x64
            os_name: "Linux"
            args: "--bundles appimage,deb,rpm"
          - platform: windows-latest
            real_platform: windows-latest
            arch: x64
            os_name: "Windows (x64)"
            args: "--bundles nsis"
          - platform: windows-latest-arm64
            real_platform: windows-latest
            arch: arm64
            os_name: "Windows (ARM64)"
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.real_platform }}
    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.real_platform == 'macos-latest' && (matrix.arch == 'x64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || (matrix.real_platform == 'windows-latest' && matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || '') }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.real_platform }}-${{ matrix.arch }}

      - name: install dependencies (ubuntu only)
        if: matrix.real_platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev rpm

      - name: install frontend dependencies
        run: npm ci

      - name: build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Signature des mises à jour (clé générée par « tauri signer generate »).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tauri.release.conf.json active les artefacts signés de l'updater.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Package macOS DMG
        if: matrix.real_platform == 'macos-latest'
        shell: bash
        run: |
          chmod +x scripts/macos/build.sh
          ARCH_OVERRIDE="${{ matrix.arch }}" ./scripts/macos/build.sh

          # Archive de mise à jour (.app.tar.gz) : même nom pour les deux architectures,
          # on la renomme avant de la publier.
          VERSION="${{ needs.check-version.outputs.version }}"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then TARGET=aarch64-apple-darwin; else TARGET=x86_64-apple-darwin; fi
          BUNDLE="src-tauri/target/$TARGET/release/bundle/macos"
          cp "$BUNDLE/Pattelock.app.tar.gz" "dist/Pattelock_${VERSION}_${{ matrix.arch }}.app.tar.gz"
          cp "$BUNDLE/Pattelock.app.tar.gz.sig" "dist/Pattelock_${VERSION}_${{ matrix.arch }}.app.tar.gz.sig"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.exe.sig
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.AppImage.sig
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.deb.sig
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*.rpm.sig
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig

  publish:
    name: "Publish Release"
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./all-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.check-version.outputs.body }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          gh release create $VERSION \
            --title "Pattelock $VERSION" \
            --notes "$RELEASE_NOTES" \
            --draft

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          find ./all-artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec gh release upload $VERSION {} --clobber \;

      - name: Generate and upload latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION"
          A=./all-artifacts

          # Plateforme de l'updater -> fichier publié (son .sig doit exister à côté).
          # Sur macOS, l'updater installe l'archive .app.tar.gz, pas le DMG.
          declare -A FILES=(
            [windows-x86_64]="$(find $A -name '*_x64-setup.exe' | head -n 1)"
            [windows-aarch64]="$(find $A -name '*_arm64-setup.exe' | head -n 1)"
            [darwin-x86_64]="$(find $A -name '*_x64.app.tar.gz' | head -n 1)"
            [darwin-aarch64]="$(find $A -name '*_aarch64.app.tar.gz' | head -n 1)"
            [linux-x86_64]="$(find $A -name '*.AppImage' | head -n 1)"
            [linux-x86_64-deb]="$(find $A -name '*.deb' | head -n 1)"
            [linux-x86_64-rpm]="$(find $A -name '*.rpm' | head -n 1)"
          )

          PLATFORMS='{}'
          for key in "${!FILES[@]}"; do
            file="${FILES[$key]}"
            if [ -z "$file" ] || [ ! -f "$file.sig" ]; then
              echo "::warning::pas d'artefact signé pour $key"
              continue
            fi
            # Le .sig est le texte minisign tel quel : on ne le réencode pas.
            PLATFORMS=$(jq --arg key "$key" --arg url "$BASE_URL/$(basename "$file")" --rawfile sig "$file.sig" \
              '. + {($key): {url: $url, signature: $sig}}' <<< "$PLATFORMS")
          done

          jq -n \
            --arg version "$VERSION" \
            --arg notes "Pattelock $VERSION" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json
          cat latest.json
          gh release upload $VERSION latest.json --clobber

      - name: Make release public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          gh release edit $VERSION --draft=false
