[package]
name = "pattelock"
version = "0.1.0"
description = "Pattelock: désactive temporairement des touches du clavier pour que ton chat puisse dormir dessus"
authors = ["Hugo Sohm"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/HugoSohm/pattelock"

[lib]
# Le suffixe `_lib` évite un conflit de nom entre la lib et le binaire sous Windows,
# voir https://github.com/rust-lang/cargo/issues/8519
name = "pattelock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "objc2-core-graphics"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "HIServices", "AXUIElement"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"
x11rb = "0.14"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
