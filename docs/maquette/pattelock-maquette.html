  - Clique sur une touche pour la bloquer / libérer.

  - ?etat=pause dans l'URL force l'état "en pause", ?etat=tout montre le mode clavier entier, ?vue=reglages ouvre les réglages, ?theme=dark|light|system force le thème.
  - "Verrouiller tout le clavier" (en bas à gauche) active le mode clavier entier.
  - Le bouton "..." de la barre de titre ouvre les réglages (pelage, accent, options).
  La fenêtre de référence fait 760 x 546 px (ratio ~1,392). Dans l'app, tout doit
  être mis à l'échelle de la fenêtre réelle (rem calculé depuis la largeur).

:root{
  --bg:#fbfaf7; --ink:#1f1b24; --muted:#6a6472; --line:#ebe6dd;
  --strip:#f1ede6; --key-edge:#d9d3c9; --kbd:#efebe4; --soft:#8d8794;
  --ring:#e6e1d8; --led-off:#b9b3bf; --ink-edge:#000000; --strip-shade:rgba(31,27,36,.08);
  --accent:#ff9548;
  --page:#d9d3ca;
  --notch4: -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink);
}
.win{--notch4:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink)}
/* Thème sombre : mêmes rôles, autres valeurs */
.win[data-theme=dark]{
  --bg:#1c1a21; --ink:#ece7df; --muted:#aaa3b4; --line:#2f2b36;
  --strip:#26232c; --key-edge:#3d3846; --kbd:#2f2b36; --soft:#7d7787;
  --ring:#34303b; --led-off:#5a5463; --ink-edge:#b4ada2; --strip-shade:rgba(0,0,0,.25);
}
body.dark{--page:#0f0e12}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Pixelify Sans",monospace}
button{font-family:inherit;border:0;margin:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@keyframes pl-blink{0%,60%{opacity:1}61%,100%{opacity:.15}}

.win{width:760px;height:584px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.titlebar{height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-bottom:3px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:.5px}
.winbtns{display:flex;gap:4px}
.winbtns button{width:32px;height:32px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.body{flex:1;padding:26px 32px 24px;display:flex;flex-direction:column;align-items:center}

.status{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.badge{display:flex;align-items:center;gap:8px;padding:5px 10px;font-family:"Silkscreen",monospace;font-size:11px;letter-spacing:1px}
.badge .led{width:8px;height:8px}
.on .badge{background:var(--ink);color:var(--bg)}
.on .badge .led{background:var(--accent);animation:pl-blink 1.4s steps(1) infinite}
.off .badge{background:var(--kbd);color:var(--muted)}
.off .badge .led{background:var(--led-off)}
.title{font-size:26px;font-weight:700;line-height:1.1}
.sub{font-size:14px;color:var(--muted)}
.hint{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.strip{margin-top:124px;position:relative;padding:20px;background:var(--strip);display:flex;gap:16px;box-shadow:var(--notch4),inset 0 -6px 0 0 var(--strip-shade)}
.cat{position:absolute;left:289px;top:-104px;padding:0;background:transparent;display:block;line-height:0}
.zz{position:absolute;left:372px;top:-124px;font-family:"Silkscreen",monospace;font-size:16px;letter-spacing:3px;color:var(--accent)}
.off .zz{display:none}
.group{display:flex;gap:4px}
.key{position:relative;width:34px;height:40px;padding:0;font-size:13px;font-weight:600}
.key.wide{width:46px;font-size:11px}
.key .kled{position:absolute;right:4px;top:4px;width:4px;height:4px;background:var(--accent)}
/* états */
.key.s-active{background:var(--ink);color:var(--bg);box-shadow:inset 0 -4px 0 0 var(--ink-edge)}
.key.s-last{background:var(--accent);color:var(--ink);box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.22)}
.key.s-planned{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.key.s-free{background:var(--bg);color:var(--muted);box-shadow:inset 0 -4px 0 0 var(--key-edge),inset 0 0 0 1px var(--ring)}

.activity{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);text-align:center}
.pill{padding:2px 6px 3px;background:var(--accent);color:var(--ink);font-weight:600}

.footer{align-self:stretch;margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.legend{margin-top:18px;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
.legend .sw{width:12px;height:12px}
.lockall{height:38px;padding:0 14px;display:flex;align-items:center;gap:10px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 0 -4px 0 0 var(--key-edge)}
.lockall[aria-pressed=true]{background:var(--accent);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 0 -4px 0 0 rgba(0,0,0,.22)}
.legend span.it{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px}
.shortcut{display:flex;align-items:center;gap:4px}
kbd{font-family:inherit;font-size:13px;padding:3px 7px 5px;background:var(--kbd);color:var(--ink);box-shadow:inset 0 -3px 0 0 var(--key-edge)}
.change{height:32px;margin-left:10px;padding:0 12px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;box-shadow:inset 0 -4px 0 0 var(--ink-edge)}

.catgrid{display:grid;grid-template-columns:repeat(20,var(--px,5px));grid-auto-rows:var(--px,5px)}
.catgrid.halo{grid-template-columns:repeat(22,var(--px,5px));margin:calc(-1 * var(--px,5px))}
.winbtns a{width:32px;height:32px;color:var(--muted);display:flex;align-items:center;justify-content:center}
/* réglages */
.settings{display:none;flex:1;padding:26px 32px 24px;flex-direction:column;gap:26px}
.view-settings .settings{display:flex}.view-settings .body{display:none}
.back{display:none;height:32px;padding:0 8px;align-items:center;gap:8px;background:transparent;color:var(--ink);font-size:15px;font-weight:600}
.view-settings .back{display:flex}.view-settings #openSettings{display:none}.view-settings .brand{display:none}
.lbl{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:1px;color:var(--muted)}
.furs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.fur{height:128px;padding:12px 0 10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:inset 0 0 0 2px var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.fur[aria-checked=true]{background:var(--strip);color:var(--ink);box-shadow:var(--notch4),inset 0 -6px 0 0 var(--accent)}
.accs{display:flex;gap:12px}
.acc{width:44px;height:44px;padding:6px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.acc span{display:block;width:32px;height:32px}
.acc[aria-checked=true]{box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink)}
.themes{align-self:flex-start;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--bg);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink)}
.th{height:36px;padding:0 14px;display:flex;align-items:center;gap:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.th[aria-checked=true]{background:var(--ink);color:var(--bg)}
.th i{width:10px;height:10px;box-shadow:inset 0 0 0 2px currentColor}
.opt{height:44px;padding:0;background:transparent;display:flex;align-items:center;justify-content:space-between;color:var(--ink);font-size:14px;text-align:left;border-bottom:3px solid var(--line)}
.sw2{width:48px;height:24px;padding:4px;background:var(--key-edge);display:flex;justify-content:flex-start;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink)}
.sw2 span{width:16px;height:16px;background:var(--bg)}
.opt[aria-checked=true] .sw2{background:var(--accent);justify-content:flex-end}
</style>
</head>
<body>
<div class="win on" id="win">
  <div class="titlebar">
    <button class="back" id="back"><svg width="8" height="12" viewBox="0 0 4 6" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="2"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/></svg><span>Réglages</span></button>
    <div class="brand">
      <svg width="14" height="14" viewBox="0 0 5 5" fill="var(--accent)" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="1" y="2" width="3" height="1"/><rect x="0" y="3" width="5" height="1"/><rect x="1" y="4" width="3" height="1"/></svg>
      <span>Pattelock</span>
    </div>
    <div class="winbtns">
      <button aria-label="Réglages" id="openSettings"><svg width="14" height="4" viewBox="0 0 7 2" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="3" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/></svg></button>
      <button aria-label="Réduire la fenêtre"><svg width="10" height="10" viewBox="0 0 5 5" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="2" width="5" height="1"/></svg></button>
      <button aria-label="Fermer la fenêtre"><svg width="10" height="10" viewBox="0 0 5 5" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/></svg></button>
    </div>
  </div>

  <div class="body">
    <div class="status">
      <div class="badge"><span class="led"></span><span id="tag"></span></div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="hint">
      <svg width="10" height="10" viewBox="0 0 5 5" fill="var(--accent)" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="1" y="2" width="3" height="1"/><rect x="0" y="3" width="5" height="1"/><rect x="1" y="4" width="3" height="1"/></svg>
      <span id="hint"></span>
    </div>

    <div class="strip" id="strip">
      <button class="cat" id="cat"><div class="catgrid" id="catgrid" role="img"></div></button>
      <div class="zz" aria-hidden="true">z Z</div>
    </div>

    <div class="legend" id="legend"></div>
    <div class="activity" id="activity"></div>

    <div class="footer">
      <button class="lockall" id="lockall" aria-pressed="false"><svg width="10" height="14" viewBox="0 0 5 7" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="3" height="1"/><rect x="0" y="1" width="1" height="2"/><rect id="shackle" x="4" y="1" width="1" height="1"/><rect x="0" y="3" width="5" height="2"/><rect x="0" y="5" width="2" height="1"/><rect x="3" y="5" width="2" height="1"/><rect x="0" y="6" width="5" height="1"/></svg><span id="lockLabel">Verrouiller tout le clavier</span></button>
      <div class="shortcut" id="shortcut"></div>
    </div>
  </div>

  <div class="settings">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="lbl">PELAGE DU CHAT</div>
      <div class="furs" role="radiogroup" aria-label="Pelage du chat" id="furs"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="lbl">COULEUR D’ACCENT</div>
      <div class="accs" role="radiogroup" aria-label="Couleur d’accent" id="accs"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="lbl">THÈME</div>
      <div class="themes" role="radiogroup" aria-label="Thème" id="themes"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px" id="opts"></div>
  </div>
</div>

<script>
/* ---------- Sprite du chat assis (grille 20 x 20) ---------- */
const PAL = {
  noir:    { O:'#121016', F:'#3f3a48', W:'#5d5668', P:'#ea8c9c', E:'#121016', H:'#ffffff' },
  roux:    { O:'#2b2230', F:'#f2a65a', W:'#fff4e4', P:'#f59aa8', E:'#2b2230', H:'#ffffff' },
  gris:    { O:'#2b2230', F:'#a7a5b4', W:'#eeeaf2', P:'#f59aa8', E:'#2b2230', H:'#ffffff' },
  blanc:   { O:'#2b2230', F:'#f7f3ec', W:'#ffffff', P:'#f59aa8', E:'#2b2230', H:'#ffffff' },
  siamois: { O:'#2b2230', F:'#ecd8ba', W:'#f9efe0', P:'#c9877a', E:'#3d6fb8', H:'#ffffff' }
};
const FRAMES = {
 "sleep": [
  ".OO..........OO.....",
  ".OPO........OPO.....",
  ".OPPO......OPPO.....",
  ".OPPFOOOOOOFPPO.....",
  "OFFFFFFFFFFFFFFO....",
  "OFFFFFFFFFFFFFFO....",
  "OFFOOOFFFFOOOFFO....",
  "OFFFFFFFFFFFFFFO....",
  "OPPFFFWPPWFFFPPO....",
  "OFFFFWOWWOWFFFFO....",
  ".OFFFFWOOWFFFFO.....",
  "..OFFWWWWWWFFO......",
  ".OFFFWWWWWWFFFO..OO.",
  ".OFFFWWWWWWFFFO.OFO.",
  "OFFFFWWWWWWFFFFO.OFO",
  "OFFFFWWWWWWFFFFO.OFO",
  "OFFFOWWOOWWOFFFOOFO.",
  "OFFFOWWOOWWOFFFOFO..",
  "OFFOWWWOOWWWOFFOO...",
  ".OOOOOOOOOOOOOO....."
 ],
 "awake": [
  ".OO..........OO.....",
  ".OPO........OPO.....",
  ".OPPO......OPPO.....",
  ".OPPFOOOOOOFPPO.....",
  "OFFFFFFFFFFFFFFO....",
  "OFFHEFFFFFFHEFFO....",
  "OFFEEFFFFFFEEFFO....",
  "OFFFFFFFFFFFFFFO....",
  "OPPFFFWPPWFFFPPO....",
  "OFFFFWOWWOWFFFFO....",
  ".OFFFFWOOWFFFFO.....",
  "..OFFWWWWWWFFO......",
  ".OFFFWWWWWWFFFO..OO.",
  ".OFFFWWWWWWFFFO.OFO.",
  "OFFFFWWWWWWFFFFO.OFO",
  "OFFFFWWWWWWFFFFO.OFO",
  "OFFFOWWOOWWOFFFOOFO.",
  "OFFFOWWOOWWOFFFOFO..",
  "OFFOWWWOOWWWOFFOO...",
  ".OOOOOOOOOOOOOO....."
 ]
};
/* En thème sombre, le contour sombre des chats se perd dans le fond : on ajoute un HALO
   d'1 pixel-sprite autour de la silhouette (pixels transparents voisins d'un pixel plein),
   sans toucher au dessin d'origine. La grille passe de 20x20 à 22x22 et une marge négative
   d'1 pixel-sprite garde le chat exactement à la même place. */
const HALO = '#5c566a';
function withHalo(rows){
  const h = rows.length, w = rows[0].length;
  const g = Array.from({length: h + 2}, (_, y) => Array.from({length: w + 2}, (_, x) =>
    (y >= 1 && y <= h && x >= 1 && x <= w) ? rows[y - 1][x - 1] : '.'));
  return g.map((row, y) => row.map((c, x) => {
    if (c !== '.') return c;
    const n = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => (g[y + dy] && g[y + dy][x + dx] || '.') !== '.');
    return n ? 'R' : '.';
  }).join(''));
}
function drawCat(el, mood, fur){
  const dark = document.getElementById('win').dataset.theme === 'dark';
  const pal = Object.assign({ R: HALO }, PAL[fur]);
  const rows = dark ? withHalo(FRAMES[mood]) : FRAMES[mood];
  el.classList.toggle('halo', dark);
  el.innerHTML = '';
  for (const row of rows) for (const ch of row){
    const d = document.createElement('div');
    d.style.background = ch === '.' ? 'transparent' : pal[ch];
    el.appendChild(d);
  }
}

/* ---------- État ---------- */
const params = new URLSearchParams(location.search);
const state = {
  on: params.get('etat') !== 'pause',
  recording: false,
  fur: params.get('pelage') || 'noir',
  blocked: { F1:1,F2:1,F3:1,F4:1,F5:0,F6:1,F7:1,F8:1,F9:1,F10:1,F11:0,F12:1,PrtSc:1,ScrLk:1,Pause:1 },
  totalCount: 1284,      // compteur total (depuis l'installation), persisté
  all: params.get('etat') === 'tout',
  view: params.get('vue') === 'reglages' ? 'settings' : 'main',
  accent: '#ff9548',
  theme: params.get('theme') || 'system',   // 'system' | 'light' | 'dark'
  autostart: true,
  media: true
};
const GROUPS = [
  [['F1'],['F2'],['F3'],['F4']],
  [['F5'],['F6'],['F7'],['F8']],
  [['F9'],['F10'],['F11'],['F12']],
  [['PrtSc','Impr.','Impression écran'],['ScrLk','Défil.','Arrêt défilement'],['Pause','Pause','Pause']]
];

function keyState(id){
  const b = !!state.blocked[id];
  if (state.all) return ['s-active','verrouillée avec tout le clavier'];
  if (state.on && b) return ['s-active','bloquée en ce moment'];
  if (b) return ['s-planned','prévue, pas encore bloquée'];
  return ['s-free','libre'];
}

function render(){
  const all = state.all;
  const on = all || state.on;
  const n = Object.values(state.blocked).filter(Boolean).length;
  const win = document.getElementById('win');
  win.classList.toggle('on', on); win.classList.toggle('off', !on);

  document.getElementById('tag').textContent = all ? 'CLAVIER ENTIER VERROUILLÉ' : on ? 'BLOCAGE EN COURS' : 'EN PAUSE, RIEN N’EST BLOQUÉ';
  document.getElementById('title').textContent = all ? 'Le chat dort sur tout le clavier' : on ? 'Le chat dort' : 'Le chat est réveillé';
  document.getElementById('sub').textContent = all ? 'Toutes les touches sont ignorées, sauf Ctrl + Alt + K. La souris fonctionne toujours.' : on
    ? n + ' touches sont désactivées en ce moment, le reste du clavier répond normalement.'
    : 'Clavier libre, toutes les touches répondent.';
  document.getElementById('hint').textContent = all ? 'Clique sur le chat ou fais Ctrl + Alt + K pour tout déverrouiller' : on ? 'Clique sur le chat pour le réveiller' : 'Clique sur le chat pour l’endormir';

  const cat = document.getElementById('cat');
  cat.setAttribute('aria-pressed', String(on));
  cat.setAttribute('aria-label', on ? 'Le chat dort, blocage en cours. Cliquer pour le réveiller.' : 'Le chat est réveillé, protection en pause. Cliquer pour l’endormir.');
  drawCat(document.getElementById('catgrid'), on ? 'sleep' : 'awake', state.fur);

  // touches
  const strip = document.getElementById('strip');
  strip.querySelectorAll('.group').forEach(g => g.remove());
  for (const group of GROUPS){
    const g = document.createElement('div'); g.className = 'group';
    for (const [id, label = id, aria = id] of group){
      const [cls, txt] = keyState(id);
      const k = document.createElement('button');
      k.className = 'key ' + cls + (group.length === 3 ? ' wide' : '');
      k.setAttribute('aria-pressed', String(all || !!state.blocked[id]));
      k.setAttribute('aria-label', aria + ', ' + txt);
      k.innerHTML = (cls === 's-active' ? '<span class="kled" aria-hidden="true"></span>' : '') + '<span>' + label + '</span>';
      k.onclick = () => { if (state.all) return; state.blocked[id] = state.blocked[id] ? 0 : 1; render(); };
      g.appendChild(k);
    }
    strip.appendChild(g);
  }

  // activité
  const names = { PrtSc:'Impr.', ScrLk:'Défil.', Pause:'Pause' };
  document.getElementById('activity').innerHTML =
    '<svg width="12" height="12" viewBox="0 0 5 5" fill="var(--accent)" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="1" y="2" width="3" height="1"/><rect x="0" y="3" width="5" height="1"/><rect x="1" y="4" width="3" height="1"/></svg>'
    + '<span><b style="color:var(--ink);font-weight:600">' + state.totalCount.toLocaleString('fr-FR') + '</b> coups de patte évités</span>';

  // légende
  const L = all
    ? [['background:var(--ink);box-shadow:inset -4px 4px 0 -2px var(--accent)','verrouillée'],
       ['background:var(--accent)','tout le reste du clavier aussi, sauf Ctrl + Alt + K']]
    : on
    ? [['background:var(--ink);box-shadow:inset -4px 4px 0 -2px var(--accent)','bloquée en ce moment'],
       ['background:var(--bg);box-shadow:inset 0 0 0 2px var(--key-edge)','libre']]
    : [['background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)','prévue, pas encore bloquée'],
       ['background:var(--bg);box-shadow:inset 0 0 0 2px var(--key-edge)','libre']];
  document.getElementById('legend').innerHTML = L.map(([css, t]) => '<span class="it"><span class="sw" style="' + css + '"></span>' + t + '</span>').join('');

  const lb = document.getElementById('lockall');
  lb.setAttribute('aria-pressed', String(all));
  document.getElementById('lockLabel').textContent = all ? 'Déverrouiller le clavier' : 'Verrouiller tout le clavier';
  document.getElementById('shackle').setAttribute('height', all ? '2' : '1');

  // raccourci
  document.getElementById('shortcut').innerHTML =
    (state.recording
      ? '<span style="color:var(--ink)">Appuie sur ta combinaison…</span>'
      : '<kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>K</kbd>')
    + '<button class="change" id="change">' + (state.recording ? 'Annuler' : 'Changer') + '</button>';
  document.getElementById('change').onclick = () => { state.recording = !state.recording; render(); };
}


/* ---------- Réglages ---------- */
const FURS = [['noir','Noir'],['roux','Roux'],['gris','Gris'],['blanc','Blanc'],['siamois','Siamois']];
const ACCENTS = [['#ff9548','Orange'],['#f4a3b4','Rose'],['#7fd1a8','Menthe'],['#8fb0ff','Bleu']];
function renderSettings(){
  const win = document.getElementById('win');
  win.classList.toggle('view-settings', state.view === 'settings');
  win.style.setProperty('--accent', state.accent);
  const furs = document.getElementById('furs'); furs.innerHTML = '';
  for (const [id, name] of FURS){
    const b = document.createElement('button');
    b.className = 'fur'; b.setAttribute('role','radio'); b.setAttribute('aria-checked', String(state.fur === id));
    const g = document.createElement('div'); g.className = 'catgrid'; g.style.setProperty('--px','4px'); g.setAttribute('aria-hidden','true');
    drawCat(g, 'awake', id);
    const l = document.createElement('span'); l.textContent = name;
    b.append(g, l);
    b.onclick = () => { state.fur = id; renderAll(); };
    furs.appendChild(b);
  }
  document.getElementById('accs').innerHTML = ACCENTS.map(([c, n]) =>
    '<button class="acc" role="radio" aria-label="' + n + '" aria-checked="' + (state.accent === c) + '" data-c="' + c + '"><span style="background:' + c + '"></span></button>').join('');
  document.querySelectorAll('.acc').forEach(b => b.onclick = () => { state.accent = b.dataset.c; renderAll(); });
  const OPTS = [['autostart','Lancer Pattelock au démarrage'],['media','Bloquer aussi les fonctions média de la rangée du haut (Mac)']];
  document.getElementById('opts').innerHTML = OPTS.map(([k, l]) =>
    '<button class="opt" role="switch" aria-checked="' + state[k] + '" data-k="' + k + '"><span>' + l + '</span><span class="sw2"><span></span></span></button>').join('');
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => { state[b.dataset.k] = !state[b.dataset.k]; renderAll(); });
}
const THEMES = [['system','Système','linear-gradient(90deg,#fbfaf7 50%,#1c1a21 50%)'],['light','Clair','#fbfaf7'],['dark','Sombre','#1c1a21']];
const mq = window.matchMedia('(prefers-color-scheme: dark)');
function resolvedTheme(){ return state.theme === 'system' ? (mq.matches ? 'dark' : 'light') : state.theme; }
mq.addEventListener('change', () => { if (state.theme === 'system') renderAll(); });
function renderTheme(){
  const dark = resolvedTheme() === 'dark';
  document.getElementById('win').dataset.theme = dark ? 'dark' : 'light';
  document.body.classList.toggle('dark', dark);
  document.getElementById('themes').innerHTML = THEMES.map(([id, l, bg]) =>
    '<button class="th" role="radio" aria-checked="' + (state.theme === id) + '" data-t="' + id + '"><i style="background:' + bg + '"></i>' + l + '</button>').join('');
  document.querySelectorAll('.th').forEach(b => b.onclick = () => { state.theme = b.dataset.t; renderAll(); });
}
function renderAll(){ document.getElementById('win').dataset.theme = resolvedTheme(); render(); renderSettings(); renderTheme(); }
document.getElementById('openSettings').onclick = () => { state.view = 'settings'; renderAll(); };
document.getElementById('back').onclick = () => { state.view = 'main'; renderAll(); };
document.getElementById('cat').onclick = () => { if (state.all) { state.all = false; state.on = false; } else state.on = !state.on; renderAll(); };
document.getElementById('lockall').onclick = () => { state.all = !state.all; renderAll(); };
renderAll();
</script>
</body>
</html>
